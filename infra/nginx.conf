upstream uzlex_backend {
    server backend:8000;
}

upstream uzlex_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32M;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location /api/ {
        proxy_pass http://uzlex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: buffering here would hold the whole answer until completion,
        # defeating streaming. read_timeout must exceed the longest LLM turn.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://uzlex_backend/health;
    }

    location /docs {
        proxy_pass http://uzlex_backend/docs;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://uzlex_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
