# fly.toml app configuration file generated for uzlex-ai on 2026-07-29T18:34:14+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'uzlex-ai'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    # Build-time, unlike the [env] block below. Set to 'true' together with
    # DENSE_RETRIEVAL_ENABLED so the weights bake into the image instead of
    # being downloaded on the first user request.
    PREFETCH_MODELS = 'false'

[env]
  DEBUG = 'false'
  ENV = 'prod'
  # Off because this machine is 2 GB and bge-m3 alone is ~2.3 GB of weights;
  # loading it here would OOM-kill the machine on the first query. It was
  # already effectively off — sentence-transformers was missing from the image,
  # so the dense branch raised on every request and nothing said so. This makes
  # that state deliberate and visible: /health now reports `dense_retrieval:
  # false` and an overall `degraded` status while it stays this way.
  #
  # To turn dense retrieval on: `flyctl scale memory 8192` (bge-m3 and
  # bge-reranker-v2-m3 are ~2.3 GB each, plus runtime), set PREFETCH_MODELS to
  # 'true' so the weights bake into the image instead of downloading on first
  # request, then set this to 'true' and deploy.
  DENSE_RETRIEVAL_ENABLED = 'false'
  RERANKER_ENABLED = 'false'
  TORCH_INDEX_URL = 'https://download.pytorch.org/whl/cpu'
  UVICORN_WORKERS = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # Keep one machine warm. Cold start here is not a normal container start: it
  # loads bge-m3 before the first request can be served, so scale-to-zero turns
  # the first question after any idle period into a 30s+ wait. That reads as a
  # broken product to anyone evaluating it, and it also breaks unattended
  # maintenance jobs, which find no running VM to exec into.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 30

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-4x'
  memory = '2gb'
  cpus = 4
  memory_mb = 2048
  processes = ['app']
