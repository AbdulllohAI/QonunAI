# fly.toml app configuration file generated for uzlex-ai on 2026-07-29T18:34:14+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'uzlex-ai'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    # Deliberately 'false'. Baking bge-m3 and the reranker into the image
    # produced a 4.8 GB image, and Fly's machine-update call times out pulling
    # it -- HTTP 408, which `flyctl deploy` swallows while still reporting
    # success, so the machines silently keep running the previous image. The
    # weights are downloaded at runtime instead; startup does not block on it.
    PREFETCH_MODELS = 'false'

# WARNING: Fly secrets shadow this block. `flyctl secrets list` is the real
# source of truth for any name that appears in both, and there is no warning
# when one silently wins. RERANKER_ENABLED was set to 'false' here and stayed
# true in the running process for exactly that reason -- which, once
# sentence-transformers was installed, meant every query tried to load a 2.3 GB
# cross-encoder on a 2 GB machine. Check `flyctl secrets list` before trusting
# anything below.
[env]
  DEBUG = 'false'
  ENV = 'prod'
  # On. Requires the 8 GB [[vm]] below: bge-m3 and bge-reranker-v2-m3 are
  # ~2.3 GB of weights each and both are resident at once, so a 2 GB machine
  # OOMs on the first query. RERANKER_ENABLED is deliberately absent here --
  # it exists as a Fly secret, which shadows this block (see warning above).
  DENSE_RETRIEVAL_ENABLED = 'true'
  TORCH_INDEX_URL = 'https://download.pytorch.org/whl/cpu'
  UVICORN_WORKERS = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # Keep one machine warm. Cold start here is not a normal container start: it
  # loads bge-m3 before the first request can be served, so scale-to-zero turns
  # the first question after any idle period into a 30s+ wait. That reads as a
  # broken product to anyone evaluating it, and it also breaks unattended
  # maintenance jobs, which find no running VM to exec into.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 30

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  # shared-cpu-4x is enough for what actually runs: dense retrieval embeds one
  # short query per request (~1.5s end to end). Dedicated cores were tried for
  # the cross-encoder reranker and did not help enough to matter -- 12
  # candidates at 320 tokens still exceeded 200s -- so the reranker is off and
  # the premium bought nothing. Still 8 GB: bge-m3 is ~2.3 GB resident.
  size = 'shared-cpu-4x'
  # 8 GB, not 2: bge-m3 (~2.3 GB) and bge-reranker-v2-m3 (~2.3 GB) are both
  # held in memory for the lifetime of the process, on top of torch and the
  # app itself. Declared here rather than set with `flyctl scale memory`,
  # because a deploy reapplies this file and would silently scale it back down.
  # Keep UVICORN_WORKERS at 1 -- each worker loads its own copy of both models,
  # and with the reranker on that is ~4.6 GB per worker.
  memory = '8gb'
  cpus = 4
  memory_mb = 8192
  processes = ['app']
