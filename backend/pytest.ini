[pytest]
testpaths = tests
python_files = test_*.py

# auto: async test functions run without needing a per-test marker. The suite
# was entirely synchronous until the model gateway, whose fallback and circuit
# breaking can only be tested against real coroutines.
asyncio_mode = auto

# Pin the fixture loop scope explicitly. Leaving it unset emits a deprecation
# warning on every run and the default is scheduled to change, which would
# silently alter fixture lifetimes.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
